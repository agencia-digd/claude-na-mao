# Claude na Mão — config tmux amigável
# Mouse mode + scroll natural + barra azul/rosa

# Mouse: clicar pra selecionar painel, scroll do trackpad funciona
set -g mouse on

# Scroll natural com Shift+PageUp / Shift+PageDown
bind -n S-PageUp copy-mode -u

# Não confirma fechamento de painel/janela
bind x kill-pane
bind X kill-window

# Reload config com prefix + r
bind r source-file ~/.tmux.conf \; display "tmux config recarregada"

# Histórico maior (10k linhas em vez do default 2k)
set -g history-limit 10000

# Cores nas paletas dig.D
set -g status-bg colour18           # azul escuro
set -g status-fg colour255           # branco
set -g window-status-current-style 'fg=colour226 bg=colour53 bold'  # amarelo em rosa pra janela ativa

# Status line minimalista
set -g status-left '#[fg=colour220] #S '
set -g status-right '#[fg=colour255] %d/%m %H:%M '
set -g status-left-length 20

# Janelas começam em 1 (mais natural pro teclado)
set -g base-index 1
setw -g pane-base-index 1

# Renumera quando você fecha uma janela
set -g renumber-windows on

# Vi keys no copy mode (familiar pra quem usa vim)
setw -g mode-keys vi
